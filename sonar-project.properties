# ==============================================================================
# SonarQube SAST Scanner Configuration - SAKEC DevSecOps Lab
# Course: CSCOR1PC302 (Software Engineering Practices)
# Project: SafeCampus Emergency Response System
# ==============================================================================

sonar.projectKey=safecampus-emergency-system
sonar.projectName=SafeCampus Emergency Response System
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Code Coverage & Test Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-report.xml

# Exclusions (Avoid scanning external dependencies and cloud scripts in SAST)
sonar.exclusions=**/node_modules/**,**/coverage/**,**/terraform/**,**/reports/**,**/docs/**,**/*.test.js

# Quality Gate Thresholds
sonar.qualitygate.wait=true
